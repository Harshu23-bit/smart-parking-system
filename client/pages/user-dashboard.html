<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ParkSmart - Dashboard</title>

    <link rel="stylesheet" href="../css/user.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        ParkSmart
    </div>

    <nav class="nav-links">

        <a href="user-dashboard.html">
            Search
        </a>

        <a href="my-bookings.html">
            My Bookings
        </a>

        <a href="my-vehicles.html">
            My Vehicles
        </a>

        <button
            class="btn btn-danger"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </nav>

</header>


<main class="container">

    <div class="space-between">

        <div>
            <h1>
                Find Your Parking
            </h1>

            <p>
                Search available parking near your destination.
            </p>
        </div>

    </div>


    <div class="card">

        <form
            id="searchForm"
            class="search-box"
        >

            <div>
                <label>
                    Destination
                </label>

                <input
                    class="input"
                    id="destination"
                    name="q"
                    autocomplete="off"
                    placeholder="Where do you want to park?"
                >
            </div>

            <div>
                <label>
                    Date
                </label>

                <input
                    class="input"
                    type="date"
                    id="date"
                    required
                >
            </div>

            <div>
                <label>
                    Start
                </label>

                <input
                    class="input"
                    type="time"
                    id="start"
                    required
                >
            </div>

            <div>
                <label>
                    End
                </label>

                <input
                    class="input"
                    type="time"
                    id="end"
                    required
                >
            </div>

            <button
                class="btn btn-primary"
                type="submit"
            >
                Search
            </button>

        </form>

    </div>


    <div
        id="results"
        class="parking-grid"
    ></div>

</main>


<script src="../js/user.js"></script>

<script>

requireUser();

let selectedDestination = {
    latitude: null,
    longitude: null
};


const dateInput =
    document.getElementById("date");

const today =
    new Date().toISOString().split("T")[0];

dateInput.min = today;


const destinationInput =
    document.getElementById(
        "destination"
    );

const destinationSuggestions =
    document.getElementById(
        "destination-suggestions"
    );

const useMyLocationButton =
    document.getElementById(
        "use-my-location"
    );


let destinationTimer;


destinationInput.addEventListener(
    "input",
    () => {

        clearTimeout(
            destinationTimer
        );


        // Text changed, so previously
        // selected coordinates are invalid.
        selectedDestination = {
            latitude: null,
            longitude: null
        };


        const query =
            destinationInput
                .value
                .trim();


        if (query.length < 3) {

            destinationSuggestions.innerHTML =
                "";

            destinationSuggestions.classList
                .remove("visible");

            return;
        }


        destinationTimer =
            setTimeout(
                async () => {

                    try {

                        const response =
                            await fetch(
                                `/api/location/autocomplete?q=${
                                    encodeURIComponent(query)
                                }`
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                "Unable to search addresses."
                            );
                        }


                        renderDestinationSuggestions(
                            data.suggestions || []
                        );


                    } catch (error) {

                        console.error(
                            "Destination search error:",
                            error
                        );
                    }

                },
                300
            );
    }
);


function renderDestinationSuggestions(
    suggestions
) {

    if (!suggestions.length) {

        destinationSuggestions.innerHTML =
            "";

        destinationSuggestions.classList
            .remove("visible");

        return;
    }


    destinationSuggestions.innerHTML =
        suggestions
            .map(
                (item, index) => `
                    <button
                        type="button"
                        class="suggestion-item"
                        data-index="${index}"
                    >
                        <span class="suggestion-icon">
                            📍
                        </span>

                        <span>
                            ${escapeHtml(
                                item.formatted
                            )}
                        </span>
                    </button>
                `
            )
            .join("");


    destinationSuggestions.classList
        .add("visible");


    destinationSuggestions
        .querySelectorAll(
            ".suggestion-item"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const location =
                        suggestions[
                            Number(
                                button.dataset.index
                            )
                        ];


                    // Clicking the suggestion
                    // confirms this destination.
                    destinationInput.value =
                        location.formatted;


                    selectedDestination = {
                        latitude:
                            location.latitude,

                        longitude:
                            location.longitude
                    };


                    destinationSuggestions.innerHTML =
                        "";

                    destinationSuggestions.classList
                        .remove("visible");
                }
            );
        });
}


document.addEventListener(
    "click",
    event => {

        if (
            !destinationInput.contains(
                event.target
            ) &&
            !destinationSuggestions.contains(
                event.target
            )
        ) {

            destinationSuggestions.classList
                .remove("visible");
        }
    }
);


document
    .getElementById("searchForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const form =
            new FormData(this);

        const date =
            document.getElementById("date").value;

        const start =
            document.getElementById("start").value;

        const end =
            document.getElementById("end").value;

        if (end <= start) {
            alert("End time must be after start time.");
            return;
        }

        const startTime =
            `${date}T${start}:00`;

        const endTime =
            `${date}T${end}:00`;

        try {

            const data =
                await searchParking({

                    q:
                        selectedDestination.latitude === null
                            ? form.get("q")
                            : "",

                    startTime,
                    endTime,

                    latitude:
                        selectedDestination.latitude,

                    longitude:
                        selectedDestination.longitude,

                    radiusKm: 5
                });

            renderParking(data.parking);

        } catch (error) {

            alert(error.message);
        }
    });


function renderParking(parking) {

    const results =
        document.getElementById("results");

    if (!parking.length) {

        results.innerHTML = `
            <div class="card">
                <h2>No parking found</h2>
                <p>
                    Try another location or time.
                </p>
            </div>
        `;

        return;
    }


    results.innerHTML =
        parking.map(p => {

            const image =
                p.images?.[0]?.image_url ||
                "../assets/images/hero-parking.jpg";

            return `
                <div class="card parking-card">

                    <img
                        class="parking-image"
                        src="${image}"
                        alt="${escapeHtml(p.name)}"
                    >

                    <h2>
                        ${escapeHtml(p.name)}
                    </h2>

                    <p>
                        📍 ${escapeHtml(p.address)}
                    </p>

                    ${
                        p.distance_km !== null &&
                        p.distance_km !== undefined
                            ? `
                                <p>
                                    📏 ${Number(
                                        p.distance_km
                                    ).toFixed(1)}
                                    km away
                                </p>
                            `
                            : ""
                    }

                    <p>
                        ⭐ 4.5
                    </p>

                    <p class="price">
                        ₹${Number(p.price_per_hour).toFixed(0)}/hr
                    </p>

                    <p class="available">
                        🟢 ${p.available_spaces}
                        spaces available
                    </p>

                    <p>
                        🚗 ${formatParkingType(p.parking_type)}
                    </p>

                    <a
                        class="btn btn-primary"
                        href="parking-details.html?id=${p.id}"
                    >
                        View Details
                    </a>

                </div>
            `;

        }).join("");
}


function formatParkingType(type) {

    return String(type || "")
        .replaceAll("_", " ")
        .replace(/\b\w/g, c => c.toUpperCase());
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
