<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSmart - User Login</title>
    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/user-login.css">
</head>

<body class="login-body">

<div class="login-page">

    <!-- ====== LEFT PANEL — Parking Hero ====== -->
    <div class="login-left">

        <!-- Brand logo (top-left) -->
        <div class="login-brand">
            <div class="login-brand-icon">P</div>
            <span class="login-brand-name">ParkSmart</span>
        </div>

        <!-- Text content -->
        <div class="login-left-content">
            <div class="login-tagline-row">
                <div class="tagline-p-icon">P</div>
                <div class="login-tagline">
                    Smarter Parking<br>for a Better Tomorrow
                </div>
            </div>
            <div class="login-tagline-sub">
                Find, book and manage parking spaces with ease. Safe. Simple. Smart.
            </div>
            <div class="login-bottom-bar">
                <div class="login-bottom-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="login-bottom-text">Park Smart. Live Better.</span>
            </div>
        </div>

    </div>

    <!-- ====== RIGHT PANEL — Login Form ====== -->
    <div class="login-right">

        <!-- Decorative circles matching reference -->
        <div class="deco-circle deco-circle-lg"></div>
        <div class="deco-circle deco-circle-sm"></div>

        <div class="login-card">

            <!-- Card header -->
            <div class="login-card-header">
                <div class="login-card-brand">
                    <span class="login-card-brand-text">Park<span>Smart</span></span>
                    <svg class="login-card-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5-10.5a2.828 2.828 0 00-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
                </div>
                <h2 class="login-card-title">Welcome Back</h2>
                <p class="login-card-subtitle">Login to find and book parking.</p>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4l-10 8L2 4"/></svg>
                        <input
                            class="input"
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <input
                            class="input"
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <div id="otpSection" class="form-group" style="display: none;">
    <label>Enter OTP</label>
    <div class="input-wrapper">
        <input
            class="input"
            type="text"
            id="loginOtp"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
        >
    </div>
    <small id="otpInfo" style="display: block; margin-top: 8px;">
        OTP sent to your registered email.
    </small>
</div>

                <button class="btn btn-primary" type="submit">
                    Login
                    <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>

            </form>

            <div class="login-links">
                <p>
                    Don't have an account?
                    <a href="user-register.html">Register</a>
                </p>
                <p>
                    <a href="index.html" class="back-link">← Back to ParkSmart</a>
                </p>
            </div>

        </div>

    </div>

</div>

<script src="../js/user.js"></script>

<script>
/* Password visibility toggle — purely visual, no form impact */
(function() {
    const toggle = document.querySelector('.password-toggle');
    if (!toggle) return;
    const pwdInput = toggle.closest('.input-wrapper').querySelector('input[name="password"]');
    const eyeOpen = toggle.querySelector('.eye-open');
    const eyeClosed = toggle.querySelector('.eye-closed');

    toggle.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        eyeOpen.style.display = isPassword ? 'none' : 'block';
        eyeClosed.style.display = isPassword ? 'block' : 'none';
    });
})();

/* ===== EXISTING LOGIN LOGIC — UNCHANGED ===== */
document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const form = new FormData(this);
        const message = document.getElementById("message");

        const email = form.get("email");
        const password = form.get("password");

        const otpSection = document.getElementById("otpSection");
        const otpInput = document.getElementById("loginOtp");
        const otpInfo = document.getElementById("otpInfo");

        try {

            // First step: Email + Password
            if (otpSection.style.display === "none") {

                const data = await loginUser(
                    email,
                    password
                );

                if (data.otp_required) {
                    otpSection.style.display = "block";

                    otpInput.required = true;

                    otpInfo.textContent =
                        "OTP sent to your registered email. Enter it below.";

                    message.textContent =
                        "OTP sent successfully. Check your email.";

                    message.classList.add("show");

                    return;
                }
            }

            // Second step: OTP
            const otp = otpInput.value.trim();

            if (!/^\d{6}$/.test(otp)) {
                throw new Error("Please enter a valid 6-digit OTP.");
            }

            const data = await verifyLoginOtp(
                email,
                otp
            );

            if (data.status === "success") {
                window.location.href = "user-dashboard.html";
            }

        } catch (error) {

            message.textContent = error.message;
            message.classList.add("show");
        }
    });
</script>

</body>
</html>
