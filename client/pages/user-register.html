<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSmart - Create Account</title>
    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/user-register.css">
</head>

<body class="register-body">

<div class="register-page">

    <!-- ====== LEFT PANEL — Parking Hero ====== -->
    <div class="register-left">

        <!-- Brand logo (top-left) -->
        <div class="register-brand">
            <div class="register-brand-icon">P</div>
            <span class="register-brand-name">ParkSmart</span>
        </div>

        <!-- Text content -->
        <div class="register-left-content">
            <div class="register-tagline-row">
                <div class="tagline-p-icon">P</div>
                <div class="register-tagline">
                    Smarter Parking<br>for a Better Tomorrow
                </div>
            </div>
            <div class="register-tagline-sub">
                Find, book and manage parking spaces with ease. Safe. Simple. Smart.
            </div>
            <div class="register-bottom-bar">
                <div class="register-bottom-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="register-bottom-text">Park Smart. Live Better.</span>
            </div>
        </div>

    </div>

    <!-- ====== RIGHT PANEL — Register Form ====== -->
    <div class="register-right">

        <!-- Decorative circles matching login page -->
        <div class="deco-circle deco-circle-lg"></div>
        <div class="deco-circle deco-circle-sm"></div>

        <div class="register-card">

            <!-- Card header -->
            <div class="register-card-header">
                <div class="register-card-brand">
                    <span class="register-card-brand-text">Park<span>Smart</span></span>
                    <svg class="register-card-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5-10.5a2.828 2.828 0 00-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
                </div>
                <h2 class="register-card-title">Create Account</h2>
                <p class="register-card-subtitle">Sign up to find and book parking.</p>
            </div>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input
                            class="input"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4l-10 8L2 4"/></svg>
                        <input
                            class="input"
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
                        <input
                            class="input"
                            type="tel"
                            name="phone"
                            placeholder="Enter your phone number"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper has-toggle">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <input
                            class="input"
                            type="password"
                            name="password"
                            minlength="8"
                            placeholder="Create password (min. 8 characters)"
                            required
                        >
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper has-toggle">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><path d="M10 16.5l1.5 1.5 3-3"/></svg>
                        <input
                            class="input"
                            type="password"
                            name="confirmPassword"
                            minlength="8"
                            placeholder="Re-enter password"
                            required
                        >
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary" type="submit">
                    Create Account
                    <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>

            </form>

            <div class="register-links">
                <p>
                    Already registered?
                    <a href="user-login.html">Login</a>
                </p>
                <p>
                    <a href="index.html" class="back-link">← Back to ParkSmart</a>
                </p>
            </div>

        </div>

    </div>

</div>

<script src="../js/user.js"></script>

<script>
/* Password visibility toggle — purely visual, no form impact */
(function() {
    const toggles = document.querySelectorAll('.password-toggle');
    toggles.forEach(toggle => {
        const pwdInput = toggle.closest('.input-wrapper').querySelector('input');
        const eyeOpen = toggle.querySelector('.eye-open');
        const eyeClosed = toggle.querySelector('.eye-closed');

        toggle.addEventListener('click', function() {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            eyeOpen.style.display = isPassword ? 'none' : 'block';
            eyeClosed.style.display = isPassword ? 'block' : 'none';
        });
    });
})();

/* ===== EXISTING REGISTRATION LOGIC — UNCHANGED ===== */
document
    .getElementById("registerForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const form = new FormData(this);
        const message = document.getElementById("message");

        const password = form.get("password");
        const confirm = form.get("confirmPassword");

        if (password !== confirm) {
            message.textContent = "Passwords do not match.";
            message.classList.add("show");
            return;
        }

        try {

            await registerUser({
                name: form.get("name"),
                email: form.get("email"),
                phone: form.get("phone"),
                password
            });

            alert("Account created successfully.");

            window.location.href = "user-login.html";

        } catch (error) {

            message.textContent = error.message;
            message.classList.add("show");
        }
    });
</script>

</body>
</html>
